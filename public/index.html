<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"> 
        <title> Finance Tracker </title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        
        <h1>Your Finance Tracker</h1>
        <div>
            <input type="text" id="name" placeholder="Transaction Name" />
            <input type="number" step="50" id="amount" placeholder="amount (+/-)" />
            <button onclick="handleAdd()" id="but_add"> Add Transaction </button>
        </div>
        <h2>Total Balance: <span id="balance" > 0 </span> </h2>

        <ol id="transaction"> </ol>
        
        <div id="modal-overlay">
            <div id="modal-box">
                <h3>Edit Transaction</h3>
                <input type="text" id="modal-name" placeholder="Transaction Name" />
                <input type="number" step="50" id="modal-amount" placeholder="amount (+/-)" />
                <div id="modal-btns">
                    <button onclick="handleSave()" id="save-btn">Save</button>
                    <button onclick="handleCancel()" id="cancel-btn">Cancel</button>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
